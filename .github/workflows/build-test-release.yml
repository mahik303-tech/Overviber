name: Multiplatform Build, Test & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A tag build publishes a GitHub release with the packages.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: Windows x64
            platform: Windows-x64
            archive_format: zip
            cmake_generator: -G "Visual Studio 17 2022" -A x64
            cmake_extra: ""

          - os: macos-14
            name: macOS Universal (Apple Silicon & Intel)
            platform: macOS-Universal
            archive_format: zip
            cmake_generator: -G Ninja
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

          - os: ubuntu-22.04
            name: Linux x64
            platform: Linux-x64
            archive_format: tar.gz
            cmake_generator: -G Ninja
            cmake_extra: ""

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The version lives in CMakeLists.txt only (project VERSION); package
      # names and texts follow it. A release tag must read v<version> and
      # needs its notes in .github/release-notes/v<version>.md.
      - name: Read Version
        shell: bash
        run: |
          version=$(sed -n 's/^project(Overviber VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then
            echo "::error file=CMakeLists.txt::no 'project(Overviber VERSION x.y.z ...)' line"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match CMakeLists.txt (VERSION $version): the tag must be v$version"
              exit 1
            fi
            if [ ! -f ".github/release-notes/v$version.md" ]; then
              echo "::error::release notes .github/release-notes/v$version.md are missing"
              exit 1
            fi
          fi
          echo "Overviber $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=Overviber-v$version-${{ matrix.platform }}" >> "$GITHUB_ENV"

      # Linux Dependency Installation
      - name: Install Linux Audio & GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            cmake \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxinerama-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev

      # macOS Ninja Installation
      - name: Install macOS Build Tools
        if: runner.os == 'macOS'
        run: |
          brew install ninja

      # CMake Configuration
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DJUCE_COPY_PLUGIN_AFTER_BUILD=OFF \
            ${{ matrix.cmake_generator }} \
            ${{ matrix.cmake_extra }}

      # Build Targets
      - name: Build Plugins & Tests (Release)
        run: |
          cmake --build build --config Release --parallel

      # MSBuild's warnings bury a failed Windows build's errors in a log of
      # 10,000+ lines: build once more, printing the errors only.
      - name: Show Build Errors (Windows)
        if: failure() && runner.os == 'Windows'
        run: |
          cmake --build build --config Release -- /nologo /verbosity:quiet /clp:ErrorsOnly

      - name: Run all scenario tests
        run: ctest --test-dir build -C Release --output-on-failure

      # Package Release Artifacts
      - name: Package Windows Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "package_win"
          New-Item -ItemType Directory -Path $packageDir -Force
          Copy-Item -Path "build/Overviber_artefacts/Release/VST3/Overviber.vst3" -Destination "$packageDir/" -Recurse -Force
          Copy-Item -Path "build/Overviber_artefacts/Release/Standalone/Overviber.exe" -Destination "$packageDir/" -Force
          if (Test-Path "build/ModernSkinDesigner_artefacts/Release/Overviber Skin Designer.exe") {
            Copy-Item -Path "build/ModernSkinDesigner_artefacts/Release/Overviber Skin Designer.exe" -Destination "$packageDir/" -Force
          }
          Copy-Item -Path "disk" -Destination "$packageDir/disk" -Recurse -Force
          @"
          =======================================================
           Overviber v${{ env.VERSION }} - 6-Voice Hybrid Wavetable Synthesizer
          =======================================================
          Installation (Windows 64-Bit):
          1. Copy 'Overviber.vst3' into your system VST3 directory:
             C:\Program Files\Common Files\VST3\
          2. Launch your DAW (Ableton, FL Studio, Reaper, Cubase, Bitwig).
          3. Or run 'Overviber.exe' to play standalone with ASIO/DirectSound.
          =======================================================
          "@ | Out-File -FilePath "$packageDir/INSTALL_WINDOWS.txt" -Encoding utf8
          Compress-Archive -Path "$packageDir/*" -DestinationPath "${{ env.ARTIFACT_NAME }}.zip" -Force

      - name: Package macOS Artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p package_mac
          cp -R "build/Overviber_artefacts/Release/VST3/Overviber.vst3" package_mac/
          if [ -d "build/Overviber_artefacts/Release/AU/Overviber.component" ]; then
            cp -R "build/Overviber_artefacts/Release/AU/Overviber.component" package_mac/
          fi
          if [ -d "build/Overviber_artefacts/Release/Standalone/Overviber.app" ]; then
            cp -R "build/Overviber_artefacts/Release/Standalone/Overviber.app" package_mac/
          fi
          cat << 'EOF' > package_mac/INSTALL_MACOS.txt
          =======================================================
           Overviber v${{ env.VERSION }} - macOS Universal (Apple Silicon & Intel)
          =======================================================
          Installation:
          1. VST3: Copy 'Overviber.vst3' to:
             /Library/Audio/Plug-Ins/VST3/  (or ~/Library/Audio/Plug-Ins/VST3/)
          2. AU (Logic Pro / GarageBand): Copy 'Overviber.component' to:
             /Library/Audio/Plug-Ins/Components/
          3. Standalone: Move 'Overviber.app' to your /Applications folder.

          Gatekeeper Quarantäne aufheben (Terminal):
             sudo xattr -cr /Library/Audio/Plug-Ins/VST3/Overviber.vst3
             sudo xattr -cr /Library/Audio/Plug-Ins/Components/Overviber.component
          =======================================================
          EOF
          cd package_mac && zip -r -y ../${{ env.ARTIFACT_NAME }}.zip ./* && cd ..

      - name: Package Linux Artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p package_linux
          cp -R "build/Overviber_artefacts/Release/VST3/Overviber.vst3" package_linux/
          if [ -f "build/Overviber_artefacts/Release/Standalone/Overviber" ]; then
            cp "build/Overviber_artefacts/Release/Standalone/Overviber" package_linux/
          fi
          cp -R disk package_linux/
          if [ -f "install_linux.sh" ]; then
            cp install_linux.sh package_linux/
            sed -i "s/^OVERVIBER_VERSION=\"\"/OVERVIBER_VERSION=\"${{ env.VERSION }}\"/" package_linux/install_linux.sh
            chmod +x package_linux/install_linux.sh
          fi
          cat << 'EOF' > package_linux/INSTALL_LINUX.txt
          =======================================================
           Overviber v${{ env.VERSION }} - Linux x64 Synthesizer
          =======================================================
          Installation:
          1. Run ./install_linux.sh (or manually copy Overviber.vst3 to ~/.vst3/)
          2. Factory presets and wavetables will be placed in ~/Documents/Overviber/
          3. Launch Reaper, Bitwig Studio, Ardour, or Carla.
          =======================================================
          EOF
          tar -czvf ${{ env.ARTIFACT_NAME }}.tar.gz -C package_linux .

      # Upload Artifact to GitHub Actions Run
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.${{ matrix.archive_format }}

      # GitHub Release Tag Upload
      - name: Publish Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Overviber ${{ github.ref_name }}
          # One file per tag: .github/release-notes/<tag>.md
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: ${{ env.ARTIFACT_NAME }}.${{ matrix.archive_format }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
